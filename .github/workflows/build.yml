name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PCFreeSpace
          --icon assets\icon.ico --add-data "assets\icon.ico;." --collect-data customtkinter app\main.py
      - uses: actions/upload-artifact@v4
        with:
          name: PCFreeSpace
          path: dist/PCFreeSpace.exe
